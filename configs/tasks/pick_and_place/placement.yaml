# ============================================================
# シーン初期配置 設定ファイル (placement.yaml)
# ============================================================
#
# 「ロボット・物体・人」の最初の置き方を 1 つにまとめた設定ファイル。
# 次の 3 セクションに分かれている:
#   robot:    ロボット(HSR)の初期位置
#   objects:  どの家具の上にどの物体を乗せるか
#   people:   アニメーションする人の配置
#
# (部屋の見た目 = 床テクスチャ・背景・照明は別の dressing.yaml が担当する)
#
# 編集後の反映: make ros2 dev run
#   (configs/ は bind mount なのでイメージのリビルドは不要)
#
# 読み込み側:
#   robot   -> launch_isaacsim.py
#   objects -> object_placement.py
#   people  -> people_spawn.py


# ============================================================
# robot: ロボット(HSR)の初期スポーン位置
# ============================================================
#
# Isaac Sim 起動時に HSR を置く位置と向き (map 座標 = world 座標)。
#
# 注意:
#   env_furniture_*.yaml の operator_position は「人(オペレータ)」の位置で、
#   ロボットの位置ではない。ロボットの初期位置はここで定義する。
#
# 座標:
#   x, y : 水平位置 (m)。このアパートの範囲は X:0.40〜8.37, Y:-1.48〜5.15。
#          床の上 (家具と重ならない場所) を指定すること。
#   yaw  : 向き (rad)。0=+X方向, 1.57≈+Y, 3.14≈-X, -1.57≈-Y。
#          ※ 人 (people) の yaw は「度」だが、ロボットは「ラジアン」なので注意。
#
# ※ 下の値は暫定 (アパート中央付近)。実際の開始位置に合わせて書き換えてください。

robot:
  x: 0.0
  y: 0.0
  yaw: 0.0


# ============================================================
# objects: 物体配置
# ============================================================
#
# どの家具の上に、どの物体を乗せるかを指定する。
# generate_wrs_task のランダム配置の代わりに使われる。
#
# 家具の名前: worlds/*.world の <include><name> と一致させること。
#   例: sink, sofa, living_table, cabinet, shelf,
#       dining_table, laundry_table, washing_machine
#
# 物体の名前: usd/wrs_models または usd/my_models のフォルダ名。
#   例: ycb_011_banana, ycb_002_master_chef_can, my_object
#   (フォルダ内に model.usd があるものだけ置ける)
#
# drop_clearance (物体を落とす高さの余白, m):
#   家具の天板から、この高さだけ上に出してスポーンする。
#   物理シミュレーションで自然に天板へ着地させるための余白。
#   大きすぎると跳ねたり転がったりするので 0.02〜0.1 程度を推奨。
#
# placements (配置リスト) の書き方:
#   placements:
#     <家具名>:
#       - <物体名>                      # 天板の中央に置く (一番簡単)
#       - object: <物体名>              # オフセット等を細かく指定する書き方
#         dx: 0.15                      # 天板中央からの横ズレ (家具のローカル座標, m)
#         dy: -0.05                     # 同上 (奥行き方向)
#         yaw: 0.3                      # 物体の向き (rad, 家具の向きに足される)
#         roll: 0.0                     # 物体を倒すとき等 (rad, 省略可)
#         pitch: 0.0                    # 同上 (rad, 省略可)
#         tier: 1                       # 段番号 (0 = 一番下の段)。省略時は 0。
#
# 段 (tier) について:
#   同じ位置に高さ違いの箱が積み重なっている家具 (cabinet, shelf など) は
#   複数の段を持つ。tier で何段目に置くかを選べる。0 が一番下、上ほど大きい数字。
#     例) cabinet は 4 段 → tier: 0,1,2,3  /  shelf は 2 段 → tier: 0,1
#   1 段だけの家具 (dining_table など) は tier を省略 (=0) すればよい。

# rc26_macs
# DiningTable：（皿，ナイフ，マグカップ）（Stackされている可能性あり），ゴミ，ゴミ以外のオブジェクト2つ
# SideTable：CommonObject中の2つ（Red Bull can，Red Pringles can，Solved Rubik’s cube，Colgate toothpaste box）
# Cabinet：ミルク，シリアルとランダムObject（DiningTableのゴミ以外のオブジェクトと同じカテゴリのオブジェクトを含む）
# Kitchen：ゴミ箱（の近くにゴミ1つ），指定されたところにBowlとSpoon（今回はLow_tableの上に）
#
# この repo に実在する model.usd だけを使う。
#   - Red Bull can / Red Pringles can は無いので YCB の缶で代替
#   - Colgate toothpaste box は無いので配置しない
#   - milk は無いので rc26_macs/water で代替
#   - cereal は rc26_macs/Granola を使用


objects:
  drop_clearance: 0.1

  placements:
    dining_table:
      # 皿・ナイフ・マグカップ。皿とナイフは同じ位置から落として stack 候補にする。
      - object: ycb_029_plate
        dx: 0.0
        dy: -0.18
        tier: 0

      - object: ycb_032_knife
        dx: 0.0
        dy: -0.18
        yaw: 1.57
        tier: 0

      - object: ycb_025_mug
        dx: 0.18
        dy: -0.18
        tier: 0

      # ゴミ
      - object: rc26_macs/kitchen_tidy_bags
        dx: -0.32
        dy: 0.18
        yaw: 0.4
        tier: 0

      # ゴミ以外のオブジェクト2つ
      - object: rc26_macs/Curry_rice
        dx: -0.18
        dy: 0.16
        tier: 0

      - object: rc26_macs/Instant_udon
        dx: 0.25
        dy: 0.12
        tier: 0


    side_table:
      # CommonObject のうち実在する近い候補2つ:
      #   Solved Rubik's cube -> ycb_077_rubiks_cube
      #   Red can             -> ycb_005_tomato_soup_can
      - object: ycb_077_rubiks_cube
        dx: -0.16
        dy: 0.0
        tier: 0

      - object: ycb_005_tomato_soup_can
        dx: 0.16
        dy: 0.0
        tier: 0

 
    # cabinet は 4 段 (tier 0=一番下 〜 3=一番上)
    cabinet:
      # milk の代替
      - object: rc26_macs/water
        tier: 0
        dx: -0.14
        dy: 0.0

      # cereal
      - object: rc26_macs/Granola
        tier: 1
        dx: 0.12
        dy: 0.0

      # DiningTable の非ゴミ物体と同じ food カテゴリのランダム物体
      - object: rc26_macs/Instant_ramen
        tier: 2
        dx: 0.0
        dy: 0.0

    # Kitchen: Bowl と Spoon を指定位置 (今回は low_table) に置く。
    low_table:
      - object: ycb_024_bowl
        dx: -0.12
        dy: 0.0
        tier: 0

      - object: ycb_031_spoon
        dx: 0.12
        dy: 0.0
        yaw: 1.57
        tier: 0


  # ============================================================
  # floor: 床に直接置く物体 (家具の上ではなく床へ)
  # ============================================================
  #
  # placements は「家具名 + 家具中心からのズレ (dx, dy)」だったが、
  # floor は「部屋の絶対座標 (x, y)」で床 (z=0) に直接置く。
  #
  #   x, y : world 座標 = map 座標 (m)。家具や人と重ならない床の上を選ぶこと。
  #          このアパートの範囲は X:0.40〜8.37, Y:-1.48〜5.15。
  #   yaw / roll / pitch : 向き (rad, 省略可)。
  #   高さ z は床 (0) + drop_clearance で自動。tier は無い (床は 1 面だけ)。
  #
  # Kitchen: ゴミ箱と、その近くにゴミ1つ。
  floor:
    - object: wrc_bin_black
      x: 1.35
      y: -1.55
      yaw: 0.0

    - object: rc26_macs/Food_wrap
      x: 1.10
      y: -1.55
      yaw: 0.8


# ============================================================
# people: アニメーションする人の配置
# ============================================================
#
# シミュレーション空間に「アニメーションする人」を置く設定。
#
# 座標:
#   x, y : 人を立たせる水平位置 (m)。world 座標 = map 座標。
#          床の上 (家具と重ならない場所) を指定すること。
#   z    : 高さ (m)。床に立たせるなら 0.0 でよい (省略時 0.0)。
#   yaw  : 向き (度, degree)。0=+X方向, 90=+Y, 180=-X, 270(または -90)=-Y。
#          ※ ロボット (robot) の yaw は「ラジアン」だが、人は分かりやすさを
#            優先して「度」で書く。
#
# motion (動きの名前): 省略すると stand_idle_loop (その場で立つ)。
#   使えるモーション (アセットサーバに実在するものだけ):
#     stand_idle_loop        立ったまま (待機)
#     stand_idle_wave_loop   手を振る (1 周ごとに手を下ろして立ちに戻る)
#     LookAround             あたりを見回す
#     Sit                    座る
#     stand_walk_loop        歩く (その場で足踏みに近い)
#     push_button            ボタンを押す
#     type_keyboard          キーボードを打つ
#   ※「手を上げっぱなしで振り続ける」専用アニメはライブラリに無い。
#     上げたまま振らせたいときは stand_idle_wave_loop + 下の loop_window を使う。
#
# loop_window (再生する時間の窓, 秒) ※任意:
#   指定した秒数の区間だけを繰り返し再生する。stand_idle_wave_loop の
#   「手を上げて振っている区間」だけをループさせ、手を下ろす部分を再生範囲から
#   外すと、"手を上げっぱなしで振り続ける" ように見せられる。
#     loop_window:
#       start: 1.0    # 区間の開始 (秒)
#       end:   2.0    # 区間の終了 (秒)
#   ※ タイムラインはシーンに 1 本だけなので、この窓は全員に共通で効く。
#   ※ 使わないときは loop_window の行ごと消す (= アニメ全体をループ)。
#   【調整のしかた】まず 1 回動かすと、ログに
#       [people] spawned "person_wave" ... motion=stand_idle_wave_loop duration=○○s
#     と「クリップの全長 (秒)」が出る。その範囲 (0〜○○) の中で start/end を動かし、
#     手が上がっている所だけが映るように合わせる。
#
# list (配置リスト) の書き方:
#   list:
#     - name: person_1        # シーン内での名前 (重複しないように)
#       x: 2.0
#       y: 1.0
#       yaw: 90               # 度
#       motion: stand_idle_loop
#
# ※ コミット時の既定は「人なし (list: [])」に戻すこと。
#   下は動作確認用に 2 人を有効にしている状態。

# people:
#   loop_window:
#     start: 1.0
#     end:   2.0

#   list:
#     # Instruction point に立っている人
#     - name: person_idle
#       x: 5.1          # アパート中央付近 (床の上・家具と重ならない想定)
#       y: 0.76
#       yaw: 180         # +Y 方向を向く (度)
#       motion: stand_idle_loop   # その場で立つ

#     - name: person_wave
#       x: 3.5
#       y: -0.5
#       yaw: 180
#       motion: stand_idle_wave_loop   # 手を振る (手を上げっぱなしは loop_window で)
