# ============================================================
# シーン初期配置 設定ファイル (placement.yaml)
# ============================================================
#
# 「ロボット・物体」の最初の置き方をまとめた設定ファイル。
#   robot:    ロボット (HSR) の初期位置
#   objects:  YCB 物体をどこに置くか (家具の上 / 床)
#   people:   人の配置 (既定は出さない。出すなら people: を参照)
#
# ★ 座標系: ロボットのスタート地点が原点 (0,0)、正面が +X。
#    こうしておくと Isaac のワールド座標と ROS の odom / map 座標が一致し、
#    ここに書いた座標をそのままナビゲーションのゴールに使える。
#    (odom の原点はロボットが起動した姿勢になる。scripts/hsr.py:3243 参照)
#    → robot: を (0,0,0) 以外にすると、この一致が崩れるので注意。
#
# 部屋は worlds/rc26_tidyup.world (4部屋の TidyUp アリーナ):
#   - 外周 8.0 x 8.0 m (X 0.4〜8.4, Y -2.4〜5.6)、壁の高さ 0.6 m
#   - 田の字に4部屋 (各 4 x 4 m の正方形)
#   - 仕切り壁のドア開口: x=4.4 の壁は y -1.0〜0.2 / 3.0〜4.2、
#                         y=1.6 の壁は x 1.8〜3.0 / 5.8〜7.0
#   - 外から入る入口は西壁の1箇所: x=0.4, y -0.6〜0.6。
#     ロボットは原点 (0,0) でその正面 0.4m に立ち、+X を向いている
#   - Room SW (西下): 片付け1 (引き出し・trofast・長机+トレイ/コンテナ)
#   - Room SE (東下): 片付け2 (ビン2・高い机・本棚2つ目)
#   - Room NW (西上): 探索1 (本棚・ソファ + 床の散乱物体)
#   - Room NE (東上): 探索2 (長机・緑ビン・円形テーブル+椅子 + 床の散乱物体)
#
# 編集後の反映: make ros2 down && make ros2 up TASK=tidyup  (configs/ は bind mount なのでリビルド不要)


# ============================================================
# robot: ロボット (HSR) の初期スポーン位置
# ============================================================
#
# ★ ここは (0, 0, 0) のまま動かさないこと。
#
#   ロボットが起動した姿勢が、そのまま odom (ひいては map) 座標の原点になる
#   (scripts/hsr.py:3243)。スポーンを原点からずらすと、その分だけ
#   「このファイルに書く座標」と「ナビゲーションに渡す座標」が食い違う。
#   実際、以前は (-1.6, 4.4, -1.501) にしていたため 4.7m + 86度 ずれていた。
#
#   スタート位置を変えたいときは、ロボットではなく worlds/rc26_tidyup.world 側
#   (部屋のほう) を動かして、スタート地点が原点に来るようにする。
#
# 座標:
#   x, y : 水平位置 (m)。原点は西壁の入口の 0.4m 手前。部屋は +X 側。
#   yaw  : 向き (rad)。0=+X方向, 1.57≈+Y, 3.14≈-X, -1.57≈-Y。

robot:
  x: 0
  y: 0
  yaw: 0    # +X が部屋の方 (ロボットの正面)


# ============================================================
# objects: 物体配置 (YCB オブジェクトのみ)
# ============================================================
#
# 家具の名前: worlds/rc26_tidyup.world の <include><name> と一致させること。
#   物を置ける家具と段 (tier):
#     wrc_long_table    : 天板 0.40m (1段)。Room NE の机
#     wrc_long_table_0  : 天板 0.40m (1段)。Room SW の片付け先テーブル
#                         (トレイ・コンテナが乗っているので普段は置かない)
#     wrc_tall_table    : 天板 0.60m (1段)。Room SE
#     wrc_bookshelf     : place用棚。tier 0=0.06 / 1=0.50 / 2=0.80 /
#                         3=1.05 / 4=2.02 (tier 4 は HSR には高すぎる)
#     wrc_bookshelf_2   : pick用棚。同上 (5段)
#
# 物体の名前: usd/wrs_models のフォルダ名 (ycb_XXX_...)。
#   使える名前の一覧: ls usd/wrs_models | grep ycb
#
# drop_clearance: 天板からこの高さだけ上に出してスポーンし、物理で着地させる。
#
# 書き方:
#   placements:                       # 家具の上に置く
#     <家具名>:
#       - <物体名>                    # 天板の中央に置く
#       - object: <物体名>            # 細かく指定する書き方
#         dx: 0.15                    #   天板中央からの横ズレ (家具ローカル, m)
#         dy: -0.05
#         yaw: 0.3                    #   物体の向き (rad)
#         tier: 1                    #   段番号 (0 = 一番下)
#   floor:                            # 床に直接置く (TidyUp の散らかし用)
#     - object: <物体名>
#       x: 1.8                        #   world 座標 (m)
#       y: 0.3

objects:
  drop_clearance: 0.1

  # --- 床に散らばった物体 (東側の探索エリア: Room NW / Room NE) ---
  floor:
    # 背の高い物体。上から掴むには縦に長すぎるので、把持方向を考える題材になる。
    - object: ycb_021_bleach_cleanser   # Room NW (立てて置く)
      x: 2.8
      y: 3.6
    - object: ycb_013_apple       # ロボット正面0.7m (HSRから少し離した位置)
      x: 2.4
      y: 3.5
    - object: ycb_004_sugar_box   # Room NE
      x: 6.2
      y: 3.2
    - object: ycb_077_rubiks_cube # Room NE
      x: 5.2
      y: 4.8

  # --- 家具の上の物体 ---
  placements:
    wrc_long_table:        # Room NE の机
      - object: ycb_002_master_chef_can
        dx: -0.3
      - object: ycb_005_tomato_soup_can
        dx: 0.3

    wrc_tall_table:        # Room SE の高い机
      - ycb_017_orange

    wrc_bookshelf:         # place用棚
      - object: ycb_009_gelatin_box
        tier: 1
      - object: ycb_003_cracker_box
        tier: 2

    wrc_bookshelf_2:       # pick用棚
      - object: ycb_021_bleach_cleanser
        tier: 1
      - object: ycb_017_orange
        tier: 2


# ============================================================
# furniture: 本物のメッシュ家具 (ソファ・椅子)
# ============================================================
#
# 読み込み側: furniture_spawn.py。worlds の家具 (wrc_*) と違い、
# リポジトリ内 usd/ 配下の USD を任意の位置に置ける。
# 向き (upAxis)・単位 (cm/m)・床への吸着は自動補正される。
#
# 各エントリのキー:
#   usd  (必須) : usd/ からの相対パス (例: sofa/Arnold.usd)
#   name (任意) : シーン内の名前
#   x, y (必須) : 置く位置 (m, world 座標)
#   yaw  (任意) : 向き (★度。0=+X, 90=+Y, 180=-X, 270=-Y)
#                 ※ ロボットの yaw (ラジアン) と単位が違うので注意

furniture:
  # Room NW: ソファ (北の壁ぎわ、部屋の中央=南を向く)
  # 元モデルは幅2.55mの大型ソファなので scale 0.7 で約1.8m幅に縮小している。
  - usd: sofa/Arnold.usd
    name: sofa
    x: 0.9
    y: 3.6
    yaw: 90
    scale: 0.7

  # Room NE: 円形テーブル (元直径1.3mを scale 0.85 で約1.1mに縮小) + 椅子 1 脚
  # 椅子は部屋の北東の角に置き、部屋の中央 (南西) を向かせる。
  # この椅子モデルは yaw=0 で座面が南(-Y)向きなので、南西向きは yaw=315。
  - usd: restaurant/round_table/model.usd
    name: round_table
    x: 5.9
    y: 3.9
    scale: 0.85
  - usd: restaurant/dining_chair/model.usd
    name: chair_1
    x: 4.8
    y: 5.1
    yaw: 45
    scale: 0.7


# ============================================================
# people: 人の配置
# ============================================================
#
# 読み込み側: scripts/people_spawn.py。Isaac 公式の人モデル (Biped) を置いて
# モーションを再生する。モデルとモーションは usd/isaac_offline/ に同梱して
# あるので、ネットに繋がっていなくても動く (会場対策)。
#
# 各エントリのキー:
#   name   (任意) : シーン内の名前 (/World/People/<name> になる)
#   x, y   (必須) : 置く位置 (m, world 座標。robot:/objects: と同じ座標系)
#   z      (任意) : 高さ (m)。床に立たせるだけなら書かなくてよい (既定 0)
#   yaw    (任意) : 向き (★度。0=+X, 90=+Y, 180=-X, 270=-Y)
#                   ※ furniture: と同じ「度」。robot: の yaw (ラジアン) と単位が違う
#   motion (任意) : 動き。同梱してあって使えるのは次の 2 つ:
#                     stand_idle_loop      … まっすぐ立つ (その場で待つ)
#                     stand_idle_wave_loop … 手を振る (立つ→振る→下ろす→立つ の繰り返し)
#                   ※ people_spawn.py は Sit など他の名前も知っているが、その USD は
#                     同梱していないのでネットが必要になる。増やしたいときは
#                     usd/isaac_offline/Isaac/People/Animations/ に .skelanim.usd を足す。
#
# 注意: 人は「見た目とアニメーションだけ」で当たり判定を持たない。
#       ロボットは人をすり抜けるので、経路をふさぐ用途には使えない。

# ★ 既定では人を出さない (list: [] のまま = 従来どおり何も置かれない)。
#
#   人を出したいときの手順は 2 つだけ:
#     1) "list: []" の行を消す
#     2) その下の "# list:" から "# motion: stand_idle_wave_loop" までの行の
#        行頭の "# " を外す (それより下の loop_window: はコメントのままでよい)

people:
  list: []

  # list:
  #   # まっすぐ立っている人: Room NW。ロボットが入ってくるドア
  #   # (y=1.6 の壁の x 1.8〜3.0 の開口) の方 = 南 (-Y) を向いて待っている。
  #   - name: person_standing
  #     x: 2.4
  #     y: 2.6
  #     yaw: 270
  #     motion: stand_idle_loop
  #
  #   # 手を振っている人: Room NE。こちらも自分の部屋のドア
  #   # (y=1.6 の壁の x 5.8〜7.0 の開口) の方 = 南 (-Y) を向いている。
  #   - name: person_waving
  #     x: 6.4
  #     y: 2.6
  #     yaw: 270
  #     motion: stand_idle_wave_loop

  # --- 手を「上げっぱなしで」振らせたいとき (任意) ---
  # stand_idle_wave_loop は「立つ→振る→手を下ろす→立つ」を繰り返すクリップで、
  # 手を上げっぱなしにする専用クリップは無い。そこで再生する秒数の範囲を
  # 「手を上げて振っている区間」だけに絞ると、上げたまま振り続けて見える。
  # 下をコメントのままにするとクリップ全体を再生する = 自然に手を振る。
  #
  # ※ タイムライン (再生ヘッド) はシーンに 1 本しかないので、この区間は
  #   person_standing にも同じように効く (立ち姿は動きが小さいので問題ない)。
  # loop_window:
  #   start: 1.0
  #   end:   2.0


# ============================================================
# arena_cameras: 競技録画用の観戦カメラ 4台 (北/南/東/西)
# ============================================================
# 競技モード (`make ros2 up TASK=tidyup TIME=600`、または task.yaml の time_limit > 0)
# のときだけ作られ、4画面を2x2に並べた mp4 を
# recordings/ に保存する。
#
# 位置や画角を変えたいときは `make ros2 tune TASK=tidyup` で GUI を見ながら調整できる。
# 動かすと recordings/tune/arena_cameras.yaml に新しい設定が、
# recordings/tune/preview.png に実際に録画される絵が書き出されるので、
# `make ros2 tune-apply TASK=tidyup` でその arena_cameras: ブロックをこのファイルに貼り替える。
#
# 書きかたは 2 通り:
#  (A) まとめて自動配置 … center のまわりに distance / height で 4方向に置く
#  (B) 1台ずつ指定     … cameras: を書く (あると A より優先。make ros2 tune の出力形式)
#        cameras:
#          north: {position: [2.0, 4.6, 3.6], look_at: [2.0, 2.0, 0.3]}
#          ...
#
# fov_deg は画角 (水平方向の視野角, 度)。大きいほど広く写る。
# focal_length (mm) でも書けるが、両方あれば fov_deg が優先される。

# 2026-07-29 に `make tune` (旧 Makefile) で GUI を見ながら調整した位置。
arena_cameras:
  resolution: [960, 720]
  fps: 15

  # 1台ずつ置いた4台 (position から look_at を見る)。
  # このブロックがあると center/distance/height は使われない。
  cameras:
    north:
      position: [-0.756, -0.191, 4.142]
      look_at: [2.271, -0.191, 0.300]
      fov_deg: 70.0
    south:
      position: [6.419, 6.599, 3.065]
      look_at: [6.439, 4.164, 0.300]
      fov_deg: 70.0
    east:
      position: [2.170, -0.450, 3.181]
      look_at: [2.315, 3.758, 0.300]
      fov_deg: 70.0
    west:
      position: [6.660, 3.171, 3.969]
      look_at: [6.611, -0.650, 0.300]
      fov_deg: 70.0
