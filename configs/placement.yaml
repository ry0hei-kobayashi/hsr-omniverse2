# ============================================================
# 物体配置 設定ファイル
# ============================================================
#
# どの家具の上に、どの物体を乗せるかをここで指定する。
# generate_wrs_task のランダム配置の代わりに使われる。
#
# 編集後の反映: `make ros2 down && make ros2 up`
#   (configs/ は bind mount なのでイメージのリビルドは不要)
#
# 家具の名前: worlds/*.world の <include><name> と一致させること。
#   例: sink, sofa, living_table, cabinet, shelf,
#       dining_table, laundry_table, washing_machine
#
# 物体の名前: usd/wrs_models または usd/my_models のフォルダ名。
#   例: ycb_011_banana, ycb_002_master_chef_can, my_object
#   (フォルダ内に model.usd があるものだけ置ける)


# ------------------------------------------------------------
# 物体を落とす高さの余白 (m)
# ------------------------------------------------------------
# 家具の天板から、この高さだけ上に出してスポーンする。
# 物理シミュレーションで自然に天板へ着地させるための余白。
# 大きすぎると跳ねたり転がったりするので 0.02〜0.1 程度を推奨。

drop_clearance: 0.1


# ------------------------------------------------------------
# 配置リスト
# ------------------------------------------------------------
# placements:
#   <家具名>:
#     - <物体名>                      # 天板の中央に置く (一番簡単)
#     - object: <物体名>              # オフセット等を細かく指定する書き方
#       dx: 0.15                      # 天板中央からの横ズレ (家具のローカル座標, m)
#       dy: -0.05                     # 同上 (奥行き方向)
#       yaw: 0.3                      # 物体の向き (rad, 家具の向きに足される)
#       roll: 0.0                     # 物体を倒すとき等 (rad, 省略可)
#       pitch: 0.0                    # 同上 (rad, 省略可)

placements:
  dining_table:
    - ycb_011_banana
    - object: ycb_002_master_chef_can
      dx: 0.2
      dy: -0.05

  living_table:
    - object: ycb_005_tomato_soup_can
      dx: -0.2
    - object: ycb_017_orange
      dx: 0.2

  shelf:
    - my_object
