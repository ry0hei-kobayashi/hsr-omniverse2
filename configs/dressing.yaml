# ============================================================
# Scene Dressing 設定ファイル
# ============================================================
#
# テクスチャ・照明のプリセットとデフォルト値をここで管理する。
# リリース後はこのファイルだけ編集すれば設定変更が反映される
# (コードを触る必要はない)。
#
# 編集後の反映: `make ros2 down && make ros2 up`
#
# 数値の書式について:
#   PyYAML (YAML 1.1) では "6e5" のような指数表記が文字列扱いされる
#   ことがあるため、float は明示的に小数点付きで書く (600000.0 など)。

# ============================================================
# デフォルト
# ============================================================
# construct_environment.apply_lab_dressing() で preset/lighting を省略した
# ときに使われる名前。下の presets / lighting のキーを指す。

defaults:
  preset: lab        # dressing_presets のどれを使うか
  lighting: default  # lighting_presets のどれを使うか


# ============================================================
# テクスチャプリセット
# ============================================================
# キー: EnvBoxConfig (scene_dressing/__init__.py) のフィールド名
#   - floor_texture:     床画像のパス (null で床なし)
#   - backdrop_textures: 周囲 4 画像 [北, 南, 東, 西] (null で背景なし)
#   - floor_tile:        床テクスチャのタイル繰り返し数 (省略時 4.0)
#   - wall_color:        world の物理壁 (/wall_*) を塗る色 [R, G, B] 各0〜1 (省略で塗らない)
#   - map_box_color:     占有地図由来の壁/障害物 (/map_box_*) を塗る色 [R, G, B] 各0〜1
#                        (省略で既定の灰色のまま)。rc26_from_map.world の壁を白くする等
#   - room_size:         部屋の一辺 (m, 省略時 15.0)
#   - room_height:       壁の高さ (m, 省略時 4.0)
#   - floor_z:           床の z 座標 (m, 省略時 0.002)
#   - center_x/center_y: 環境ボックスの中心 (m, 省略時 0,0)
#
# 注意: room_size と center_x/center_y は launch_isaacsim.py が読み込んだ
#   world (家具・壁の外周) から自動計算して上書きする。ここで値を書いても
#   通常はその自動値が優先される。固定したいときは launch_isaacsim.py 側の
#   自動計算を外すこと。
#
# 新しいテーマを追加: ここに辞書エントリを足すだけ。

dressing_presets:

  lab:
    floor_texture: /data/textures/floor.jpg
    backdrop_textures:
      - /data/textures/wall_1.jpg   # 北 (+Y)
      - /data/textures/wall_2.jpg   # 南 (-Y)
      - /data/textures/wall_3.jpg   # 東 (+X)
      - /data/textures/wall_4.jpg   # 西 (-X)
    # floor_tile: 4.0
    # room_size: 15.0
    # room_height: 4.0

  # 床のみ (背景なし)
  floor_only:
    floor_texture: /data/textures/floor.jpg
    backdrop_textures: null

  # レストラン風 (木目の床 + 暖色の塗り壁・天井なしの広い空間)。restaurant タスクで使用。
  restaurant:
    floor_texture: /data/textures/restaurant_floor.jpg   # 木製フローリング (Polyhaven, CC0)
    backdrop_textures: null
    floor_tile: 5.33   # 約15m四方の床に対し ~2.8m/タイル (テクスチャを縦横1.5倍に拡大)
    # 物理壁 (world の /wall_*) を暖色の塗り壁色に。暖かいベージュ (R,G,B 各0〜1)。
    wall_color: [0.85, 0.73, 0.55]

  # RoboCup 2026 会場の実写写真から抽出した床 + 白壁。restaurant タスクで使用。
  #   floor_texture: 会場の木目フローリングを抽出 → 木目を水平化 → 継ぎ目なしタイル化。
  #   wall_color:    会場の白壁色 (実写は照明で暗めに写るが白寄りに補正した値)。
  rc26_venue:
    floor_texture: /data/textures/rc26_venue_floor.jpg
    backdrop_textures: null   # 周囲に壁は足さない (壁は world の map_box_* がそのまま)
    floor_tile: 5.33   # restaurant と同じ縮尺から開始 (板が大き/小さすぎれば調整)
    # rc26_from_map.world の占有地図由来の壁/障害物 (/map_box_*) は既定で灰色。
    # それを会場の白壁色 (実写から抽出) に塗る。restaurant など他プリセットは
    # このキーを持たないので灰色のまま (影響しない)。
    map_box_color: [0.90, 0.89, 0.85]

  # 背景のみ (床なし)
  backdrop_only:
    floor_texture: null
    backdrop_textures:
      - /data/textures/wall_1.jpg
      - /data/textures/wall_2.jpg
      - /data/textures/wall_3.jpg
      - /data/textures/wall_4.jpg

  # ---- 新しいテーマを足すときの例 (コメントアウト) ----
  # office:
  #   floor_texture: /data/OfficeTextures/carpet.jpg
  #   backdrop_textures:
  #     - /data/OfficeTextures/office_n.jpg
  #     - /data/OfficeTextures/office_s.jpg
  #     - /data/OfficeTextures/office_e.jpg
  #     - /data/OfficeTextures/office_w.jpg
  #   floor_tile: 6.0


# ============================================================
# 照明プリセット
# ============================================================
# キー: EnvBoxConfig の照明関連フィールド + 拡張:
#   - dome_intensity:           DomeLight 強度
#   - ceiling_intensity:        天井 SphereLight 1 灯あたりの強度
#   - ceiling_count:            天井灯の数 (4 で四隅、5 で +中央)
#   - ceiling_height:           天井灯の Z 高さ (m)
#   - ceiling_color_temp:       色温度 (K, 6500=昼白色, 3000=電球色)
#   - enable_lighting:          false にすると照明追加なし
#   - default_lights_intensity: 拡張キー。/World/Light_1, /World/Light_2
#       (launch_isaacsim.py が作る既存ライト) の強度を連動制御する。
#       これがないと既存ライト 5e4 がドミネートしてプリセット切替が
#       見た目に出にくい。
#
# プリセット間の強度差は桁レベルで広く取っている (トーンマッピングで
# 圧縮されても違いが見えるよう)。

lighting_presets:

  # 標準: 壁で囲まれた部屋がしっかり明るく見える
  default:
    dome_intensity: 3000.0
    ceiling_intensity: 150000.0       # 1.5e5
    ceiling_count: 4
    ceiling_height: 3.7
    ceiling_color_temp: 6500.0        # 昼白色
    default_lights_intensity: 50000.0 # 5e4 (launch_isaacsim.py の既存値)

  # より明るい (撮影用など)。restaurant 専用。少しだけ抑えた値 (元の約75%)。
  bright:
    dome_intensity: 7500.0
    ceiling_intensity: 450000.0       # 4.5e5 (default の 3 倍)
    ceiling_count: 5                  # 四隅 + 中央
    ceiling_color_temp: 6500.0
    default_lights_intensity: 150000.0

  # スタジオ級 (オーバーキル気味)
  studio:
    dome_intensity: 20000.0
    ceiling_intensity: 1500000.0      # 1.5e6 (default の 10 倍)
    ceiling_count: 5
    ceiling_color_temp: 5600.0        # デイライト
    default_lights_intensity: 500000.0

  # 薄暗い (夜の部屋イメージ)
  dim:
    dome_intensity: 300.0
    ceiling_intensity: 15000.0        # 1.5e4 (default の 1/10)
    ceiling_count: 4
    ceiling_color_temp: 6500.0
    default_lights_intensity: 5000.0

  # 電球色 (温かみのある雰囲気、明るさは default 同等)
  warm:
    dome_intensity: 3000.0
    ceiling_intensity: 150000.0
    ceiling_count: 4
    ceiling_color_temp: 3000.0        # 電球色
    default_lights_intensity: 50000.0

  # 照明追加なし + 既存ライトも消灯 (ほぼ真っ暗、デバッグ用)
  off:
    enable_lighting: false
    default_lights_intensity: 0.0
