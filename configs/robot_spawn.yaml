# ============================================================
# ロボット(HSR)の初期スポーン位置
# ============================================================
#
# Isaac Sim 起動時に HSR を置く位置と向き (map 座標 = world 座標)。
# launch_isaacsim.py がこのファイルを読み込んで HSR を配置する。
#
# 注意:
#   env_furniture_*.yaml の operator_position は「人(オペレータ)」の位置で、
#   ロボットの位置ではない。ロボットの初期位置はこのファイルで定義する。
#
# 座標:
#   x, y : 水平位置 (m)。このアパートの範囲は X:0.40〜8.37, Y:-1.48〜5.15。
#   yaw  : 向き (rad)。0=+X方向, 1.57≈+Y, 3.14≈-X, -1.57≈-Y。
#
# 編集後の反映: make ros2 dev run (configs/ はマウント済みなので再ビルド不要)。
#
# ※ 下の値は暫定 (アパート中央付近)。実際の開始位置に合わせて書き換えてください。
#   床の上 (家具と重ならない場所) を指定すること。

x: 5.526
y: 5.521
yaw: -1.57
