services:
  ros2:
    build:
      context: ..
      dockerfile: env_docker/Dockerfile.ros2
    image: hsr-omniverse-ros2:jazzy
    ipc: host
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - QT_X11_NO_MITSHM=1
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///cyclonedds.xml}
      # 学生環境 (Apptainer: hma_env2) が 26 を既定にしているので合わせる。
      # 揃っていないと ROS 2 は互いを一切見つけられない。make up ROS_DOMAIN_ID=31 で変更可。
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-26}
    volumes:
      # DDS 設定を live マウント。既定は /cyclonedds.xml (マルチキャスト版)。
      #   make up localhost  -> /cyclonedds.localhost.xml (lo に閉じる。docs/dds-localhost.md)
      #   make up pc         -> /cyclonedds.pc.xml (別 PC と unicast。scripts/gen_cyclonedds_pc.sh)
      # ※ イメージに COPY 済みなのは cyclonedds.xml だけ。他の 2 つはこの bind mount でしか
      #    存在しないので、外すと CYCLONEDDS_URI が解決できなくなる。
      - ../assets/cyclonedds.xml:/cyclonedds.xml:ro
      - ../assets/cyclonedds.localhost.xml:/cyclonedds.localhost.xml:ro
      - ../assets/cyclonedds.pc.xml:/cyclonedds.pc.xml:ro
      - ../launch/hsr.launch.py:/hsr.launch.py:ro
      # 圧縮中継スクリプトもライブマウント(編集を再ビルド無しで反映)。
      # マウント先は Dockerfile.ros2 の焼き込み先・hsr.launch.py の参照先と同じ root パス。
      - ../scripts/rgbd_republisher.py:/rgbd_republisher.py:ro
      # 制御指示のサンプルコード (実習用)。hsr.launch.py の use_grasp_tf が
      # /examples/grasp_tf_broadcaster.py を起動する。編集が即反映されるよう live マウント。
      - ../examples:/examples:ro
      # hsrb_moveit_config (hsr-project) の設定を 2 ファイルだけ上書きする。
      #   moveit-no-octomap.rviz  : octomap 表示を切った MoveIt RViz 設定
      #   joint_limits-smooth.yaml: 速度/加速度上限を緩めて軌道を滑らかにした joint_limits
      # パッケージ本体は改変せず bind mount で差し替える (出自は各ファイル先頭のコメント参照)。
      - ../assets/moveit-no-octomap.rviz:/ws/install/hsrb_moveit_config/share/hsrb_moveit_config/config/moveit.rviz:ro
      - ../assets/joint_limits-smooth.yaml:/ws/install/hsrb_moveit_config/share/hsrb_moveit_config/config/joint_limits.yaml:ro
    # RViz2 は既定オフ。`make up RVIZ=1` で USE_RVIZ=true が渡る。
    command: ["ros2", "launch", "/hsr.launch.py", "use_rviz:=${USE_RVIZ:-false}"]
    security_opt:
      - seccomp:unconfined
  cacheproxy:
    build:
      context: ..
      dockerfile: env_docker/Dockerfile.cacheproxy
    network_mode: host
  isaacsim:
    build:
      context: ..
      dockerfile: env_docker/Dockerfile.isaacsim
    image: hsr-omniverse-isaacsim:jazzy
    ipc: host
    network_mode: host
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    devices:
      - /dev/dri:/dev/dri
    environment:
      - DISPLAY
      - ACCEPT_EULA=Y
      - http_proxy=http://127.0.0.1:3128
      - NVIDIA_VISIBLE_DEVICES=all
      # 起動するタスク (configs/tasks/<TASK>/)。`make up TASK=hri` で渡る。
      # 未指定なら空 → launch_isaacsim.py は configs 直下の既定で起動。
      - TASK=${TASK:-}
      # スポーンするロボット。`make up robot=hsrb` で渡る。
      # 未指定なら空 → launch_isaacsim.py は placement.yaml の robot.model を使う。
      - ROBOT=${ROBOT:-}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///cyclonedds.xml}
      # ros2 サービスと同じ値にすること (学生環境に合わせて 26)
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-26}

      # ---- タスク設定 (configs/tasks/<TASK>/task.yaml) の上書き ----------------
      # 競技モード: `make up TASK=tidyup TIME=600` で競技時間 (秒・シミュ内時間) が渡る。
      # 空なら task.yaml の time_limit に従う。
      - TASK_TIME=${TASK_TIME:-}
      # `make up TASK=tidyup SEED=1`: タスクフォルダ内の placement.seed<N>.yaml を読む。
      - PLACEMENT_SEED=${PLACEMENT_SEED:-}
      # カメラ調整モード: `make tune TASK=<name>` で 1 が渡る。観戦カメラ4台を作るだけで
      # 録画も自動終了もせず、GUI で動かした位置を recordings/tune/ に書き出す。
      - CAMERA_TUNE=${CAMERA_TUNE:-}
      # アタッチ把持(吸い付き)。既定は無効で、物理接触(摩擦)のみで把持する。
      # 確実に保持させたいときだけ `make up GRASP=1` で有効化する。
      - GRASP_ATTACH=${GRASP_ATTACH:-0}
      # reset_world の姿勢キャプチャをスポーン root のサブツリー全体に広げる。
      # 0 にすると root のみの旧挙動 (モデル内部のメッシュを手で動かすと戻らない)。
      - RESET_DEEP_CAPTURE=${RESET_DEEP_CAPTURE:-1}

      # ---- 台車 / アーム / 引き出しの物理パラメータ (既定値と説明は Makefile) ------
      - BASE_DIRECT_DRIVE=${BASE_DIRECT_DRIVE:-1}
      # 車輪に力を掛けて台車を動かすのをやめ、速度指令から次フレームの位置と向きを
      # 計算して kinematic anchor をそこへ直接追従させる。回転指令に並進が混ざる/
      # 車輪が滑る/停止後に揺り戻す、といった現象をまとめて断つための方式。
      # 0 にすると平面ジョイント上の動剛体へ速度を書く従来経路に戻る (切り分け用)。
      - BASE_KINEMATIC_DRIVE=${BASE_KINEMATIC_DRIVE:-1}
      - BASE_KINEMATIC_COLLISION=${BASE_KINEMATIC_COLLISION:-1}
      - BASE_COLLISION_RADIUS=${BASE_COLLISION_RADIUS:-0.24}
      - BASE_COLLISION_HEIGHT=${BASE_COLLISION_HEIGHT:-0.25}
      - BASE_COLLISION_MARGIN=${BASE_COLLISION_MARGIN:-0.01}
      - BASE_KINEMATIC_ANCHOR_MODE=${BASE_KINEMATIC_ANCHOR_MODE:-usd}
      - ARM_FLEX_MAX_FORCE=${ARM_FLEX_MAX_FORCE:-300}
      - DRAWER_JOINTS=${DRAWER_JOINTS:-1}
      - DRAWER_PULL_LIMIT=${DRAWER_PULL_LIMIT:-0.30}
      - DRAWER_DAMPING=${DRAWER_DAMPING:-15.0}
      - DRAWER_DAMPING_MAX_FORCE=${DRAWER_DAMPING_MAX_FORCE:-200.0}
      - BASE_VELOCITY_WRITE=${BASE_VELOCITY_WRITE:-1}
      - BASE_TRAJ_P_GAIN=${BASE_TRAJ_P_GAIN:-2.0}
      - BASE_TRAJ_D_GAIN=${BASE_TRAJ_D_GAIN:-0.5}
      - BASE_TRAJ_I_GAIN=${BASE_TRAJ_I_GAIN:-4.0}
      - BASE_TRAJ_I_LINEAR_LIMIT=${BASE_TRAJ_I_LINEAR_LIMIT:-0.08}
      - BASE_TRAJ_I_ANGULAR_LIMIT=${BASE_TRAJ_I_ANGULAR_LIMIT:-0.15}
      - BASE_CMD_TAU=${BASE_CMD_TAU:-0.10}
      - BASE_WHEEL_ACCEL_LIMIT=${BASE_WHEEL_ACCEL_LIMIT:-41.7}
      - BASE_STEER_ACCEL_LIMIT=${BASE_STEER_ACCEL_LIMIT:-5.0}
      - BASE_LINEAR_ACCEL_LIMIT=${BASE_LINEAR_ACCEL_LIMIT:-1.0}
      - BASE_ANGULAR_ACCEL_LIMIT=${BASE_ANGULAR_ACCEL_LIMIT:-2.0}
      - BASE_WHEEL_DRIVE_DAMPING=${BASE_WHEEL_DRIVE_DAMPING:-10.0}
      - BASE_PASSIVE_WHEEL_DAMPING=${BASE_PASSIVE_WHEEL_DAMPING:-0.001}
      - BASE_WHEEL_DRIVE_MAX_FORCE=${BASE_WHEEL_DRIVE_MAX_FORCE:-10.0}
      - BASE_STEER_DRIVE_DAMPING=${BASE_STEER_DRIVE_DAMPING:-5.0}
      - BASE_STEER_DRIVE_MAX_FORCE=${BASE_STEER_DRIVE_MAX_FORCE:-5.0}
      - BASE_DIRECT_JOINT_DAMPING=${BASE_DIRECT_JOINT_DAMPING:-1.0}
      - BASE_DIRECT_JOINT_MAX_FORCE=${BASE_DIRECT_JOINT_MAX_FORCE:-1.0}
      - BASE_DIRECT_ROOT_DAMPING=${BASE_DIRECT_ROOT_DAMPING:-2.0}
      - BASE_BRAKE=${BASE_BRAKE:-1}
      - BASE_BRAKE_ENGAGE_LINEAR=${BASE_BRAKE_ENGAGE_LINEAR:-0.05}
      - BASE_BRAKE_ENGAGE_ANGULAR=${BASE_BRAKE_ENGAGE_ANGULAR:-0.10}
      - BASE_BRAKE_CREEP_SPEED=${BASE_BRAKE_CREEP_SPEED:-0.05}
      - BASE_BRAKE_CREEP_ANGULAR=${BASE_BRAKE_CREEP_ANGULAR:-0.15}
      - BASE_BRAKE_K=${BASE_BRAKE_K:-200000}
      - BASE_BRAKE_C=${BASE_BRAKE_C:-20000}
      - BASE_BRAKE_MAX_FORCE=${BASE_BRAKE_MAX_FORCE:-20000}
      - BASE_BRAKE_ANGULAR_K=${BASE_BRAKE_ANGULAR_K:-50000}
      - BASE_BRAKE_ANGULAR_C=${BASE_BRAKE_ANGULAR_C:-5000}
      - BASE_BRAKE_MAX_TORQUE=${BASE_BRAKE_MAX_TORQUE:-5000}
      - BASE_PHYSICS_REPORT=${BASE_PHYSICS_REPORT:-1}
      - BASE_SETPOINT_MAX_LAG=${BASE_SETPOINT_MAX_LAG:-0.02}
      - BASE_SETPOINT_MAX_LAG_ANGULAR=${BASE_SETPOINT_MAX_LAG_ANGULAR:-0.05}
      - BASE_GOAL_VELOCITY_TOLERANCE=${BASE_GOAL_VELOCITY_TOLERANCE:-0.10}
      - BASE_JOINT_BRAKE=${BASE_JOINT_BRAKE:-1}
      - OBJECT_POSE_REPORT=${OBJECT_POSE_REPORT:-1}
      - BASE_DIAG=${BASE_DIAG:-0}

      # ---- 描画レート --------------------------------------------------------------
      # カメラ publish [Hz] = 60 / RENDER_EVERY_N_STEPS / (CAMERA_FRAME_SKIP + 1) * RTF
      # 既定は 60/2/1 = 30 Hz で実機の HSR に合わせる。物理・whole-body制御・/clock は 60 Hz のまま。
      - CAMERA_FRAME_SKIP=${CAMERA_FRAME_SKIP:-0}
      - RENDER_EVERY_N_STEPS=${RENDER_EVERY_N_STEPS:-2}
      # head_l/head_r ステレオ(1280x960 x2)は描画予算の 73% を食うのに購読者が居ないので既定 off。
      - ENABLE_STEREO_CAMERAS=${ENABLE_STEREO_CAMERAS:-0}
    volumes:
      # DDS 設定を live マウント (ros2 サービスと同じ。`make up localhost` / `pc` で切り替わる)
      - ../assets/cyclonedds.xml:/cyclonedds.xml:ro
      - ../assets/cyclonedds.localhost.xml:/cyclonedds.localhost.xml:ro
      - ../assets/cyclonedds.pc.xml:/cyclonedds.pc.xml:ro
      # 競技モードの録画出力先 (ホストの recordings/ にそのまま出る。コンテナは root で動くので root 所有になる)
      - ../recordings:/recordings:rw
      - ../scripts/launch_isaacsim.py:/app/launch_isaacsim.py:ro
      # launch_isaacsim.py から分離したモジュール (ステップ4)
      - ../scripts/task_config.py:/app/task_config.py:ro
      - ../scripts/drawers.py:/app/drawers.py:ro
      # 観戦カメラ録画 / tune (task.yaml の arena_cameras: true で使う)
      - ../scripts/arena_cameras.py:/app/arena_cameras.py:ro
      - ../scripts/hsr.py:/app/hsr.py:ro
      # hsr.py から分離したモジュール (ステップ4)。hsr.py と一緒に live マウントする。
      - ../scripts/hsr_params.py:/app/hsr_params.py:ro
      - ../scripts/hsr_math.py:/app/hsr_math.py:ro
      - ../scripts/hsr_kinematics.py:/app/hsr_kinematics.py:ro
      - ../scripts/hsr_action_servers.py:/app/hsr_action_servers.py:ro
      - ../scripts/hsr_sensors.py:/app/hsr_sensors.py:ro
      - ../scripts/hsr_physics.py:/app/hsr_physics.py:ro
      - ../scripts/hsr_grasp.py:/app/hsr_grasp.py:ro
      - ../scripts/hsr_base_drive.py:/app/hsr_base_drive.py:ro
      - ../scripts/hsr_hsrc_ex.py:/app/hsr_hsrc_ex.py:ro
      # semu.robotics.ros2_bridge (submodule) も live マウント (再ビルド無しで反映)
      - ../3rdparty/semu.robotics.ros2_bridge:/app/3rdparty/semu.robotics.ros2_bridge:ro
      - ../scripts/object_placement.py:/app/object_placement.py:ro
      - ../scripts/people_spawn.py:/app/people_spawn.py:ro
      - ../scripts/furniture_spawn.py:/app/furniture_spawn.py:ro
      # 部屋の見た目(dressing)を編集中なので live マウントする。これらは未マウントだと
      # イメージ内の古い焼き込み版が動き、configs/dressing.yaml の新キー(wall_color 等)と
      # 食い違ってクラッシュする。マウントしておけばホストの編集が再ビルド無しで反映される。
      - ../scripts/construct_environment.py:/app/construct_environment.py:ro
      - ../scripts/dressing_presets.py:/app/dressing_presets.py:ro
      - ../scene_dressing:/app/scene_dressing:ro
      - ../worlds:/app/worlds:ro

      # usd フォルダ全体をホスト側から live マウントする。
      # こうすると my_models / rc26_practice_day_1 など、どのサブフォルダに
      # モデルを足しても再ビルド不要で反映される。
      # (イメージにも ADD usd で焼き込み済みなので、マウントを外せばイメージ内が使われる)
      # ※ ホスト側で wrs_models / hsrb サブモジュールが checkout 済みである必要あり。
      - ../usd:/app/usd:ro

      # configs/ はリリース後の運用調整用に bind mount でホスト側を優先
      # (イメージにも焼き込みされているのでマウントを外せばイメージ内のデフォルトが使われる)
      - ../configs:/app/configs:ro
      # テクスチャはデフォルトで repo 内の configs/textures/ を使う
      # (本物の lab テクスチャを焼き込み済み)。
      - ../configs/textures:/data/textures:ro

      #- /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro
      #- /usr/share/vulkan/implicit_layer.d:/usr/share/vulkan/implicit_layer.d:ro
      - ${HOME}/.hsr-omniverse/cache/kit:/isaac-sim/kit/cache:rw
      - ${HOME}/.hsr-omniverse/cache/ov:/root/.cache/ov:rw
      - ${HOME}/.hsr-omniverse/cache/pip:/root/.cache/pip:rw
      - ${HOME}/.hsr-omniverse/cache/glcache:/root/.cache/nvidia/GLCache:rw
      - ${HOME}/.hsr-omniverse/cache/computecache:/root/.nv/ComputeCache:rw
      - ${HOME}/.hsr-omniverse/cache/data:/root/.local/share/ov/data:rw
      - ${HOME}/.hsr-omniverse/logs:/root/.nvidia-omniverse/logs:rw
    depends_on:
      - cacheproxy
