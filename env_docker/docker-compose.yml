version: "2.3"
services:
  ros-noetic:
    build:
      context: ..
      dockerfile: env_docker/Dockerfile.ros
    ipc: host
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics
    security_opt:
      - seccomp:unconfined
  cacheproxy:
    build:
      context: ..
      dockerfile: env_docker/Dockerfile.cacheproxy
    network_mode: host
  isaacsim:
    build:
      context: ..
      dockerfile: env_docker/Dockerfile.isaacsim
    ipc: host
    network_mode: host
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    devices:
      - /dev/dri:/dev/dri
    environment:
      - DISPLAY
      - ACCEPT_EULA=Y
      - http_proxy=http://127.0.0.1:3128
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HSR_ROS_VERSION=1
    volumes:
      # configs/ はリリース後の運用調整用に bind mount でホスト側を優先
      # (イメージにも焼き込みされているのでマウントを外せばイメージ内のデフォルトが使われる)
      - ../configs:/app/configs:ro
      # テクスチャはデフォルトで repo 内の configs/textures/ を使う。
      # 本番テクスチャを使うときは ${HOME}/datasets/SceneTextures などに置き換える。
      - ../configs/textures:/data/textures:ro
      #- /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro
      #- /usr/share/vulkan/implicit_layer.d:/usr/share/vulkan/implicit_layer.d:ro
      - ${HOME}/.hsr-omniverse/cache/kit:/isaac-sim/kit/cache:rw
      - ${HOME}/.hsr-omniverse/cache/ov:/root/.cache/ov:rw
      - ${HOME}/.hsr-omniverse/cache/pip:/root/.cache/pip:rw
      - ${HOME}/.hsr-omniverse/cache/glcache:/root/.cache/nvidia/GLCache:rw
      - ${HOME}/.hsr-omniverse/cache/computecache:/root/.nv/ComputeCache:rw
      - ${HOME}/.hsr-omniverse/cache/data:/root/.local/share/ov/data:rw
      - ${HOME}/.hsr-omniverse/logs:/root/.nvidia-omniverse/logs:rw
    depends_on:
      - ros-noetic
      - cacheproxy
